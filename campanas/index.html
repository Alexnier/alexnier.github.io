<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Campañas · fuente para OBS</title>
<!-- 27 nov 2026 · CAMPAÑAS DE PATROCINIO PARA OBS (idea de Alex y Vick: «un html que ponga la gente en su OBS, activo por
     periodos y que ya no envíe señal cuando acabe la campaña»). Neutral: sin Lumi ni marca del canal; solo el arte del
     patrocinador y una etiqueta «Patrocinado».

     CÓMO LO USA UN STREAMER: en OBS → Fuente → Navegador → URL
        https://alexnier.github.io/campanas/?canal=SU_NOMBRE      ancho 1920 · alto 1080 · fondo transparente.
     Opciones en la URL:
        ?canal=vick        quién es (las campañas pueden ser solo para ciertos canales: "canales" en campanas.json)
        &pos=abajo-der     dónde sale: arriba-izq | arriba-der | abajo-izq | abajo-der (por defecto) | abajo-centro
        &tam=1             tamaño (0.5 a 2)
        &prueba=1          enseña la campaña activa (o la primera) todo el tiempo, para acomodarla en OBS
        &estilo=neutral    (por defecto) tarjeta sobria con el color de la campaña
        &estilo=lumi       «Canal 404» del canal Alexnier: papel con tinta, cinta «Patrocina», Lumi chibi señalando
        &estilo=ge         Game Effect: negro y naranja #F5812B, Barlow Condensed, sin morado (revista/DESIGN.md)
     En la campaña: "logo_claro" (logo para fondo claro, estilo lumi) y "logo_oscuro" (para fondo oscuro, estilo ge), en arte/.
     QUÉ HACE: lee campanas.json cada REVISAR_MIN minutos. Una campaña sale SOLO si hoy está entre "inicio" y "fin", es uno de
     sus "dias", la hora está dentro de "horas" (zona del Pacífico de México) y el canal está en "canales" ("*" = todos).
     Dentro de ese horario aparece cada "cada_min" minutos durante "dura_seg" segundos, sincronizado con el reloj (a todos
     los streamers les sale al mismo tiempo). Fuera de campaña la fuente queda TRANSPARENTE y vacía (no enseña nada).
     Quién manda: campanas.json (lo edita Alex). El arte va en campanas/arte/ (PNG o WebP, idealmente 1200×300). -->
<meta name="viewport" content="width=1920">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@700&family=Barlow+Condensed:wght@300;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif}
#c{position:absolute;opacity:0;transform:translateY(30px) scale(.96);transition:opacity .5s,transform .5s;transform-origin:bottom right}
#c.on{opacity:1;transform:none}
.abajo-der{right:40px;bottom:40px}.abajo-izq{left:40px;bottom:40px;transform-origin:bottom left!important}
.arriba-der{right:40px;top:40px;transform-origin:top right!important}.arriba-izq{left:40px;top:40px;transform-origin:top left!important}
.abajo-centro{left:50%;bottom:40px;translate:-50% 0;transform-origin:bottom center!important}
#c img{display:block;max-width:calc(600px*var(--tam));max-height:calc(220px*var(--tam));border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.tarjeta{width:calc(560px*var(--tam));padding:calc(18px*var(--tam)) calc(22px*var(--tam));border-radius:14px;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.45);background:var(--color,#222)}
.tarjeta b{display:block;font-size:calc(34px*var(--tam));line-height:1.05;letter-spacing:.01em}
.tarjeta span{display:block;margin-top:6px;font-size:calc(20px*var(--tam));opacity:.92}
.tarjeta em{display:block;margin-top:8px;font-style:normal;font-weight:700;font-size:calc(18px*var(--tam))}
/* estilo lumi (Canal 404) */
.lumi{display:flex;align-items:center;gap:calc(14px*var(--tam));width:calc(640px*var(--tam));padding:calc(16px*var(--tam)) calc(20px*var(--tam)) calc(16px*var(--tam)) calc(118px*var(--tam));
 background:#FFF4FE;color:#1A0B2E;border:calc(4px*var(--tam)) solid #1A0B2E;border-radius:14px;box-shadow:calc(7px*var(--tam)) calc(7px*var(--tam)) 0 #8B3FD9;position:relative}
#c .lumi .chibi{max-width:none;max-height:none;border-radius:0;box-shadow:none;position:absolute;left:calc(-34px*var(--tam));bottom:calc(-8px*var(--tam));height:calc(170px*var(--tam));filter:drop-shadow(3px 3px 0 #1A0B2E)}
#c .lumi .lg{flex:none;max-height:calc(64px*var(--tam));max-width:calc(210px*var(--tam));border-radius:0;box-shadow:none}
.lumi .tx{min-width:0}.lumi b{display:block;font:400 calc(32px*var(--tam))/1 Anton,sans-serif;text-transform:uppercase}
.lumi span{display:block;margin-top:4px;font:700 calc(16px*var(--tam))/1.3 "Space Mono",monospace;color:#3A1566}
.lumi em{display:block;margin-top:5px;font:700 calc(15px*var(--tam)) "Space Mono",monospace;font-style:normal;color:#8B3FD9}
.lumi+.etq{background:#1A0B2E;border-radius:4px;transform:rotate(-2deg);box-shadow:3px 3px 0 #8B3FD9;font-family:Anton,sans-serif;font-weight:400;letter-spacing:.06em;left:calc(110px*var(--tam))}
/* estilo ge (Game Effect) */
.ge{display:flex;align-items:center;gap:calc(18px*var(--tam));width:calc(620px*var(--tam));padding:calc(16px*var(--tam)) calc(22px*var(--tam));background:#0A0A0A;color:#F3EBDD;
 border-left:calc(8px*var(--tam)) solid #F5812B;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#c .ge .lg{flex:none;max-height:calc(60px*var(--tam));max-width:calc(200px*var(--tam));border-radius:0;box-shadow:none}
.ge b{display:block;font:700 calc(34px*var(--tam))/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:#FBB03B}
.ge span{display:block;margin-top:4px;font:300 calc(20px*var(--tam))/1.2 "Barlow Condensed",sans-serif}
.ge em{display:block;margin-top:4px;font:600 calc(18px*var(--tam)) "Barlow Condensed",sans-serif;font-style:normal;color:#F5812B}
.ge+.etq{background:#F5812B;color:#0A0A0A;font-family:"Barlow Condensed",sans-serif;font-size:calc(15px*var(--tam));border-radius:2px}
.etq{position:absolute;top:calc(-14px*var(--tam));left:12px;padding:2px 10px;border-radius:6px;background:rgba(0,0,0,.75);color:#fff;font:700 calc(13px*var(--tam)) system-ui;letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<div id="c"></div>
<script>
const REVISAR_MIN = 5;                       /* cada cuánto relee campanas.json */
const ZONA = 'America/Tijuana';
const DIAS = ['dom', 'lun', 'mar', 'mie', 'jue', 'vie', 'sab'];
const q = new URLSearchParams(location.search), CANAL = (q.get('canal') || '').toLowerCase(), PRUEBA = q.get('prueba') === '1';
const c = document.getElementById('c'), ESTILO = ['lumi', 'ge'].includes(q.get('estilo')) ? q.get('estilo') : 'neutral';
c.className = ['arriba-izq', 'arriba-der', 'abajo-izq', 'abajo-der', 'abajo-centro'].includes(q.get('pos')) ? q.get('pos') : 'abajo-der';
document.body.style.setProperty('--tam', Math.min(2, Math.max(.5, parseFloat(q.get('tam')) || 1)));
let campanas = [], mostrando = null;

/* fecha y hora en la zona del Pacífico de México */
function ahoraPac() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: ZONA, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { fecha: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute,
           dia: DIAS[['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday)] };
}
const aMin = h => { const [a, b] = h.split(':').map(Number); return a * 60 + (b || 0); };
function vigente(k, a) {
  if (k.activa === false) return false;
  if (k.inicio && a.fecha < k.inicio) return false;
  if (k.fin && a.fecha > k.fin) return false;
  if (k.dias && k.dias.length && !k.dias.map(d => d.toLowerCase().slice(0, 3).replace('mié', 'mie').replace('sáb', 'sab')).includes(a.dia)) return false;
  if (k.horas) { const [i, f] = k.horas.split('-').map(aMin); if (!(i <= f ? a.min >= i && a.min < f : a.min >= i || a.min < f)) return false; }
  const cs = (k.canales || ['*']).map(x => x.toLowerCase());
  return cs.includes('*') || (CANAL && cs.includes(CANAL));
}
async function cargar() {
  try { campanas = (await (await fetch('campanas.json?' + Date.now(), { cache: 'no-store' })).json()).campanas || []; } catch (e) {}
}
function pintar(k) {
  c.innerHTML = '';
  const etq = document.createElement('div'); etq.className = 'etq'; etq.textContent = k.etiqueta || (ESTILO === 'lumi' ? 'Patrocina' : 'Patrocinado');
  if (k.imagen) { const im = document.createElement('img'); im.src = 'arte/' + k.imagen; im.alt = k.marca || ''; c.append(im); }
  else if (ESTILO !== 'neutral') {   /* 27 nov 2026: estilos del canal (lumi) y de Game Effect (ge) */
    const t = document.createElement('div'); t.className = ESTILO;
    const logo = ESTILO === 'lumi' ? (k.logo_claro || k.logo_oscuro) : (k.logo_oscuro || k.logo_claro);
    t.innerHTML = (ESTILO === 'lumi' ? '<img class="chibi" src="arte/lumi-senala.webp" alt="">' : '') + (logo ? '<img class="lg" alt="">' : '') + '<div class="tx"><b></b><span></span><em></em></div>';
    if (logo) t.querySelector('.lg').src = 'arte/' + logo;
    t.querySelector('b').textContent = k.titulo || k.marca || ''; t.querySelector('span').textContent = k.mensaje || ''; t.querySelector('em').textContent = k.enlace || '';
    c.append(t);
  }
  else {
    const t = document.createElement('div'); t.className = 'tarjeta'; t.style.setProperty('--color', k.color || '#222');
    t.innerHTML = '<b></b><span></span><em></em>'; t.querySelector('b').textContent = k.marca || '';
    t.querySelector('span').textContent = k.mensaje || ''; t.querySelector('em').textContent = k.enlace || ''; c.append(t);
  }
  c.append(etq);
}
function tick() {
  const a = ahoraPac(), activas = campanas.filter(k => vigente(k, a));
  let k = null;
  if (PRUEBA) k = activas[0] || campanas[0] || null;
  else if (activas.length) {
    /* reloj compartido: todas las fuentes de todos los streamers prenden al mismo tiempo */
    const seg = Math.floor(Date.now() / 1000);
    const cand = activas.filter(x => seg % ((x.cada_min || 15) * 60) < (x.dura_seg || 20));
    k = cand.length ? cand[Math.floor(seg / 60) % cand.length] : null;
  }
  if (k && k !== mostrando) { pintar(k); requestAnimationFrame(() => c.classList.add('on')); }
  if (!k && mostrando) { c.classList.remove('on'); setTimeout(() => { if (!mostrando) c.innerHTML = ''; }, 600); }
  mostrando = k;
}
cargar().then(tick); setInterval(cargar, REVISAR_MIN * 60000); setInterval(tick, 1000);
</script>
</body></html>
