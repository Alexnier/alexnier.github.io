<!doctype html><html lang="es"><head><meta charset="utf-8">
<title>Campañas · fuente para OBS</title>
<!-- 27 nov 2026 · CAMPAÑAS DE PATROCINIO PARA OBS (idea de Alex y Vick: «un html que ponga la gente en su OBS, activo por
     periodos y que ya no envíe señal cuando acabe la campaña»). Neutral: sin Lumi ni marca del canal; solo el arte del
     patrocinador y una etiqueta «Patrocinado».

     CÓMO LO USA UN STREAMER: en OBS → Fuente → Navegador → URL
        https://alexnier.github.io/campanas/?canal=SU_NOMBRE      ancho 1920 · alto 1080 · fondo transparente.
     Opciones en la URL:
        ?canal=vick        quién es (las campañas pueden ser solo para ciertos canales: "canales" en campanas.json)
        &pos=abajo-der     dónde sale: arriba-izq | arriba-der | abajo-izq | abajo-der (por defecto) | abajo-centro
        &tam=1             tamaño (0.5 a 2)
        &prueba=1          enseña la campaña activa (o la primera) todo el tiempo, para acomodarla en OBS
        &estilo=neutral    (por defecto) tarjeta sobria con el color de la campaña
        &estilo=lumi       «Canal 404» del canal Alexnier (28 nov 2026 rehecho): placa con el logo, título de una línea, mensaje,
                           botón con el enlace, cinta «Patrocina · スポンサー», CH-404, Lumi señalando y barra de tiempo (dura_seg);
                           "qr" (imagen en arte/, p. ej. con qrencode) pone el QR con «ESCANEA»; "lumi_dice" el globo de Lumi
                           (por defecto «¡Chécalo!»; "" lo quita)
        &estilo=ge         Game Effect: negro y naranja #F5812B, Barlow Condensed, sin morado (revista/DESIGN.md)
     En la campaña: "logo_claro" (logo para fondo claro, estilo lumi) y "logo_oscuro" (para fondo oscuro, estilo ge), en arte/.
     QUÉ HACE: lee campanas.json cada REVISAR_MIN minutos. Una campaña sale SOLO si hoy está entre "inicio" y "fin", es uno de
     sus "dias", la hora está dentro de "horas" (zona del Pacífico de México) y el canal está en "canales" ("*" = todos).
     Dentro de ese horario aparece cada "cada_min" minutos durante "dura_seg" segundos, sincronizado con el reloj (a todos
     los streamers les sale al mismo tiempo). Fuera de campaña la fuente queda TRANSPARENTE y vacía (no enseña nada).
     VISTAS (27 nov 2026): cada vez que una tarjeta sale (no en ?prueba=1) avisa a VISTAS con la campaña y el canal; el bot de
     Lumi cuenta impresiones y, si el canal está en "canales_youtube", cuánta gente lo veía en ese momento (vistas estimadas).
     Quién manda: campanas.json (lo edita Alex). El arte va en campanas/arte/ (PNG o WebP, idealmente 1200×300). -->
<meta name="viewport" content="width=1920">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;600;700&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif}
#c{position:absolute;opacity:0;transform:translateY(30px) scale(.96);transition:opacity .5s,transform .5s;transform-origin:bottom right}
#c.on{opacity:1;transform:none}
.abajo-der{right:40px;bottom:40px}.abajo-izq{left:40px;bottom:40px;transform-origin:bottom left!important}
.arriba-der{right:40px;top:40px;transform-origin:top right!important}.arriba-izq{left:40px;top:40px;transform-origin:top left!important}
.abajo-centro{left:50%;bottom:40px;translate:-50% 0;transform-origin:bottom center!important}
#c img{display:block;max-width:calc(600px*var(--tam));max-height:calc(220px*var(--tam));border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.tarjeta{width:calc(560px*var(--tam));padding:calc(18px*var(--tam)) calc(22px*var(--tam));border-radius:14px;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.45);background:var(--color,#222)}
.tarjeta b{display:block;font-size:calc(34px*var(--tam));line-height:1.05;letter-spacing:.01em}
.tarjeta span{display:block;margin-top:6px;font-size:calc(20px*var(--tam));opacity:.92}
.tarjeta em{display:block;margin-top:8px;font-style:normal;font-weight:700;font-size:calc(18px*var(--tam))}
/* estilo lumi (Canal 404) — 28 nov 2026 rehecho (Alex: «siento que está muy simple, ¿lo podemos hacer más bonito?»):
   placa de papel con el logo, título de una línea que se ajusta solo, mensaje, botón con el enlace, cinta «PATROCINA»,
   renglón de pantalla «CH-404 ▸ COMERCIAL», trama y kanji 広告 de fondo, Lumi más grande saliéndose del marco y barra de
   tiempo abajo. Se mueve solo al entrar y la barra (OBS dibuja los navegadores con el procesador: nada de blur animado).
   Colores y letras del sistema del canal (overlays/assets/sistema/marca.css): tinta #12061F, papel #FFF3FC, marca #9B4DE0,
   morado #6B2FB0, lavanda #C46BFF, rosa #FF8AE2; Anton (títulos), Space Mono (datos), Zen Kaku (japonés). */
#c .lumi{zoom:var(--tam);box-sizing:border-box;position:relative;width:820px;height:206px;padding:30px 26px 34px 168px;display:flex;align-items:center;gap:22px;
 background:#FFF3FC;color:#12061F;border:4px solid #12061F;border-radius:18px;box-shadow:9px 9px 0 #6B2FB0;isolation:isolate}
.lumi .fondo{position:absolute;inset:0;border-radius:14px;overflow:hidden;z-index:-1}
.lumi .trama{position:absolute;right:-10px;top:-10px;width:300px;height:150px;background:radial-gradient(circle,#C46BFF 32%,transparent 35%) 0 0/14px 14px;
 -webkit-mask:radial-gradient(ellipse 100% 100% at 100% 0,#000,transparent 70%);mask:radial-gradient(ellipse 100% 100% at 100% 0,#000,transparent 70%);opacity:.45}
.lumi .kana{position:absolute;right:-14px;bottom:-34px;font:900 118px/1 "Zen Kaku Gothic New",sans-serif;color:transparent;-webkit-text-stroke:2px rgba(155,77,224,.13)}
.lumi .osd{position:absolute;right:20px;top:11px;display:flex;align-items:center;gap:8px;font:700 13px/1 "Space Mono",monospace;letter-spacing:.14em;color:#6B2FB0}
.lumi .osd i{width:9px;height:9px;border-radius:50%;background:#FF5A8A;box-shadow:0 0 6px #FF5A8A;animation:cmLate 1.4s steps(2,jump-none) infinite}
@keyframes cmLate{50%{opacity:.2}}
.lumi .cinta{position:absolute;left:150px;top:-22px;display:flex;align-items:baseline;gap:10px;padding:7px 16px 5px;background:linear-gradient(180deg,#B565F5,#9B4DE0);
 color:#fff;border:3px solid #12061F;box-shadow:5px 5px 0 #12061F;transform:rotate(-3deg);font:400 21px/1 Anton,sans-serif;letter-spacing:.06em;
 text-transform:uppercase;text-shadow:2px 2px 0 #12061F;white-space:nowrap}
.lumi .cinta small{font:900 13px/1 "Zen Kaku Gothic New",sans-serif;letter-spacing:.1em;color:#E7C2FF;text-shadow:none}
#c .lumi .chibi{position:absolute;left:-58px;bottom:-14px;height:250px;max-width:none;max-height:none;border-radius:0;box-shadow:none;
 filter:drop-shadow(4px 4px 0 #12061F);transform-origin:50% 100%}
.lumi .placa{flex:none;display:grid;place-items:center;width:200px;height:106px;padding:10px 14px;background:#fff;border:3px solid #12061F;border-radius:10px;
 box-shadow:5px 5px 0 #C46BFF;transform:rotate(-2deg)}
#c .lumi .placa img{max-width:100%;max-height:80px;border-radius:0;box-shadow:none}
.lumi .placa strong{font:400 34px/1 Anton,sans-serif;text-transform:uppercase;text-align:center}
.lumi .tx{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.lumi .tit{display:block;width:100%;font:400 40px/1.02 Anton,sans-serif;text-transform:uppercase;white-space:nowrap;letter-spacing:.005em}
.lumi .msg{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 16px/1.35 "Space Mono",monospace;color:#3A1566}
.lumi .cta{display:inline-flex;align-items:center;gap:9px;margin-top:3px;padding:7px 14px 6px 11px;background:#12061F;color:#fff;border-radius:7px;
 box-shadow:4px 4px 0 #9B4DE0;font:700 16px/1 "Space Mono",monospace;letter-spacing:.02em}
.lumi .cta em{font-style:normal}
.lumi .cta b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#FF8AE2;color:#12061F;font-size:10px}
.lumi .barra{position:absolute;left:168px;right:26px;bottom:11px;height:6px;border-radius:3px;background:#E7C2FF;overflow:hidden}
.lumi .barra i{display:block;height:100%;background:linear-gradient(90deg,#9B4DE0,#FF8AE2);transform-origin:left;animation:cmBarra var(--dura,25s) linear forwards}
@keyframes cmBarra{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* entrada (solo una vez por aparición) */
#c.on .lumi{animation:cmEntra .55s cubic-bezier(.2,1.25,.4,1) both}
#c.on .lumi .chibi{animation:cmLumi .6s .18s cubic-bezier(.2,1.5,.4,1) both}
#c.on .lumi .cinta{animation:cmCinta .5s .3s cubic-bezier(.2,1.4,.4,1) both}
#c.on .lumi .placa{animation:cmPlaca .5s .22s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cmEntra{from{opacity:0;transform:translateX(-46px) rotate(-1.5deg)}}
@keyframes cmLumi{from{opacity:0;transform:translateY(40px) scale(.82) rotate(-6deg)}}
@keyframes cmCinta{from{opacity:0;transform:rotate(-12deg) translateY(-10px) scale(.9)}}
@keyframes cmPlaca{from{opacity:0;transform:rotate(-8deg) scale(.9)}}
.prueba .lumi .barra i{animation-iteration-count:infinite}
#c.abajo-izq .lumi,#c.arriba-izq .lumi{margin-left:64px}   /* que Lumi no quede cortada en la orilla */
/* 28 nov 2026 (2) · Alex: «¿lo puedes mejorar más?»: QR del patrocinador (campo "qr"), título con relieve de la marca,
   globo de Lumi (campo "lumi_dice"; por defecto «¡Chécalo!»), visor en las esquinas del logo y un destello al entrar. */
#c .lumi.con-qr{width:960px}
.lumi.con-qr .osd{right:150px}
.lumi.con-qr .barra{right:150px}
.lumi .tit{text-shadow:1px 1px 0 #C46BFF,2px 2px 0 #C46BFF,3px 3px 0 #9B4DE0,4px 4px 0 #6B2FB0;padding:0 6px 4px 0}
.lumi .placa{position:relative}
.lumi .visor i{position:absolute;width:18px;height:18px;border:4px solid #9B4DE0}
.lumi .visor i:nth-child(1){left:-11px;top:-11px;border-right:0;border-bottom:0}
.lumi .visor i:nth-child(2){right:-11px;top:-11px;border-left:0;border-bottom:0}
.lumi .visor i:nth-child(3){left:-11px;bottom:-11px;border-right:0;border-top:0}
.lumi .visor i:nth-child(4){right:-11px;bottom:-11px;border-left:0;border-top:0}
.lumi .qr{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 9px 7px;background:#fff;
 border:3px solid #12061F;border-radius:10px;box-shadow:5px 5px 0 #FF8AE2;transform:rotate(2.5deg)}
#c .lumi .qr img{width:86px;height:86px;max-width:none;max-height:none;border-radius:0;box-shadow:none;image-rendering:pixelated}
.lumi .qr span{font:400 14px/1 Anton,sans-serif;letter-spacing:.14em;color:#12061F}
.lumi .globo{position:absolute;left:-6px;top:-66px;padding:8px 12px 6px;background:#fff;border:3px solid #12061F;border-radius:12px;
 box-shadow:4px 4px 0 #FF8AE2;font:400 19px/1 Anton,sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#12061F;transform:rotate(-6deg);white-space:nowrap;z-index:2}
.lumi .globo::after{content:"";position:absolute;left:auto;right:26px;bottom:-12px;width:14px;height:14px;background:#fff;border:3px solid #12061F;
 border-top:0;border-left:0;transform:rotate(45deg) skew(10deg,10deg)}
.lumi .brillo{position:absolute;top:-20px;bottom:-20px;left:0;width:110px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
 transform:translateX(-160px) skewX(-18deg);opacity:0}
#c.on .lumi .brillo{animation:cmBrillo .9s .55s ease-out both}
@keyframes cmBrillo{0%{opacity:1;transform:translateX(-160px) skewX(-18deg)}100%{opacity:1;transform:translateX(1000px) skewX(-18deg)}}
#c.on .lumi .globo{animation:cmGlobo .45s .75s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cmGlobo{from{opacity:0;transform:rotate(-14deg) scale(.4) translateY(14px)}}
#c.on .lumi .qr{animation:cmQr .5s .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cmQr{from{opacity:0;transform:rotate(12deg) scale(.85)}}
/* estilo ge (Game Effect) */
.ge{display:flex;align-items:center;gap:calc(18px*var(--tam));width:calc(620px*var(--tam));padding:calc(16px*var(--tam)) calc(22px*var(--tam));background:#0A0A0A;color:#F3EBDD;
 border-left:calc(8px*var(--tam)) solid #F5812B;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#c .ge .lg{flex:none;max-height:calc(60px*var(--tam));max-width:calc(200px*var(--tam));border-radius:0;box-shadow:none}
.ge b{display:block;font:700 calc(34px*var(--tam))/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:#FBB03B}
.ge span{display:block;margin-top:4px;font:300 calc(20px*var(--tam))/1.2 "Barlow Condensed",sans-serif}
.ge em{display:block;margin-top:4px;font:600 calc(18px*var(--tam)) "Barlow Condensed",sans-serif;font-style:normal;color:#F5812B}
.ge+.etq{background:#F5812B;color:#0A0A0A;font-family:"Barlow Condensed",sans-serif;font-size:calc(15px*var(--tam));border-radius:2px}
.etq{position:absolute;top:calc(-14px*var(--tam));left:12px;padding:2px 10px;border-radius:6px;background:rgba(0,0,0,.75);color:#fff;font:700 calc(13px*var(--tam)) system-ui;letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<div id="c"></div>
<script>
const REVISAR_MIN = 5;                       /* cada cuánto relee campanas.json */
const VISTAS = 'https://lumichan.tail13f4d9.ts.net/campanas/visto';   /* 27 nov 2026: avisa cada aparición (bot: apoyos.py §11); en modo prueba no */
const ZONA = 'America/Tijuana';
const DIAS = ['dom', 'lun', 'mar', 'mie', 'jue', 'vie', 'sab'];
const q = new URLSearchParams(location.search), CANAL = (q.get('canal') || '').toLowerCase(), PRUEBA = q.get('prueba') === '1';
const c = document.getElementById('c'), ESTILO = ['lumi', 'ge'].includes(q.get('estilo')) ? q.get('estilo') : 'neutral';
c.className = ['arriba-izq', 'arriba-der', 'abajo-izq', 'abajo-der', 'abajo-centro'].includes(q.get('pos')) ? q.get('pos') : 'abajo-der';
document.body.style.setProperty('--tam', Math.min(2, Math.max(.5, parseFloat(q.get('tam')) || 1)));
let campanas = [], mostrando = null;
if (PRUEBA) document.body.classList.add('prueba');

/* fecha y hora en la zona del Pacífico de México */
function ahoraPac() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: ZONA, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { fecha: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute,
           dia: DIAS[['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday)] };
}
const aMin = h => { const [a, b] = h.split(':').map(Number); return a * 60 + (b || 0); };
function vigente(k, a) {
  if (k.activa === false) return false;
  if (k.inicio && a.fecha < k.inicio) return false;
  if (k.fin && a.fecha > k.fin) return false;
  if (k.dias && k.dias.length && !k.dias.map(d => d.toLowerCase().slice(0, 3).replace('mié', 'mie').replace('sáb', 'sab')).includes(a.dia)) return false;
  if (k.horas) { const [i, f] = k.horas.split('-').map(aMin); if (!(i <= f ? a.min >= i && a.min < f : a.min >= i || a.min < f)) return false; }
  const cs = (k.canales || ['*']).map(x => x.toLowerCase());
  return cs.includes('*') || (CANAL && cs.includes(CANAL));
}
async function cargar() {
  try { campanas = (await (await fetch('campanas.json?' + Date.now(), { cache: 'no-store' })).json()).campanas || []; } catch (e) {}
}
function pintar(k) {
  c.innerHTML = '';
  const etq = document.createElement('div'); etq.className = 'etq'; etq.textContent = k.etiqueta || (ESTILO === 'lumi' ? 'Patrocina' : 'Patrocinado');
  if (k.imagen) { const im = document.createElement('img'); im.src = 'arte/' + k.imagen; im.alt = k.marca || ''; c.append(im); }
  else if (ESTILO === 'lumi') {   /* 28 nov 2026: Canal 404 rehecho (ver CSS «estilo lumi») */
    const t = document.createElement('div'); t.className = 'lumi'; t.style.setProperty('--dura', (k.dura_seg || 20) + 's');
    const logo = k.logo_claro || k.logo_oscuro;
    t.innerHTML = '<div class="fondo"><div class="trama"></div><div class="kana">広告</div><div class="brillo"></div></div>'
      + '<img class="chibi" src="arte/lumi-senala.webp" alt="">'
      + (k.lumi_dice === '' ? '' : '<div class="globo"></div>')
      + '<div class="cinta">' + (k.etiqueta ? '' : 'Patrocina') + '<small>スポンサー</small></div>'
      + '<div class="osd"><i></i>CH-404 ▸ COMERCIAL</div>'
      + '<div class="placa"><div class="visor"><i></i><i></i><i></i><i></i></div>' + (logo ? '<img alt="">' : '<strong></strong>') + '</div>'
      + '<div class="tx"><b class="tit"></b><span class="msg"></span>' + (k.enlace ? '<span class="cta"><b>▶</b><em></em></span>' : '') + '</div>'
      + (k.qr ? '<div class="qr"><img alt=""><span>ESCANEA</span></div>' : '')
      + '<div class="barra"><i></i></div>';
    if (k.qr) { t.classList.add('con-qr'); t.querySelector('.qr img').src = 'arte/' + k.qr; }
    if (k.lumi_dice !== '') t.querySelector('.globo').textContent = k.lumi_dice || '¡Chécalo!';
    if (k.etiqueta) t.querySelector('.cinta').prepend(k.etiqueta);
    if (logo) { const im = t.querySelector('.placa img'); im.src = 'arte/' + logo; im.alt = k.marca || ''; }
    else t.querySelector('.placa strong').textContent = k.marca || '';
    t.querySelector('.tit').textContent = k.titulo || k.marca || '';
    t.querySelector('.msg').textContent = k.mensaje || '';
    if (k.enlace) t.querySelector('.cta em').textContent = k.enlace;
    c.append(t);
    ajustar(t.querySelector('.tit'));
    if (document.fonts) document.fonts.ready.then(() => ajustar(t.querySelector('.tit')));
    return;   /* la cinta ya dice «Patrocina»: sin la etiqueta de abajo */
  }
  else if (ESTILO !== 'neutral') {   /* 27 nov 2026: estilo de Game Effect (ge) */
    const t = document.createElement('div'); t.className = ESTILO;
    const logo = ESTILO === 'lumi' ? (k.logo_claro || k.logo_oscuro) : (k.logo_oscuro || k.logo_claro);
    t.innerHTML = (ESTILO === 'lumi' ? '<img class="chibi" src="arte/lumi-senala.webp" alt="">' : '') + (logo ? '<img class="lg" alt="">' : '') + '<div class="tx"><b></b><span></span><em></em></div>';
    if (logo) t.querySelector('.lg').src = 'arte/' + logo;
    t.querySelector('b').textContent = k.titulo || k.marca || ''; t.querySelector('span').textContent = k.mensaje || ''; t.querySelector('em').textContent = k.enlace || '';
    c.append(t);
  }
  else {
    const t = document.createElement('div'); t.className = 'tarjeta'; t.style.setProperty('--color', k.color || '#222');
    t.innerHTML = '<b></b><span></span><em></em>'; t.querySelector('b').textContent = k.marca || '';
    t.querySelector('span').textContent = k.mensaje || ''; t.querySelector('em').textContent = k.enlace || ''; c.append(t);
  }
  c.append(etq);
}
/* 28 nov 2026: el título en UNA línea: baja la letra hasta que quepa (de 40 a 24 px) */
function ajustar(el) {
  if (!el) return; let s = 40; el.style.fontSize = s + 'px';
  while (el.scrollWidth > el.clientWidth && s > 24) { s -= 1; el.style.fontSize = s + 'px'; }
}
function tick() {
  const a = ahoraPac(), activas = campanas.filter(k => vigente(k, a));
  let k = null;
  if (PRUEBA) k = activas[0] || campanas[0] || null;
  else if (activas.length) {
    /* reloj compartido: todas las fuentes de todos los streamers prenden al mismo tiempo */
    const seg = Math.floor(Date.now() / 1000);
    const cand = activas.filter(x => seg % ((x.cada_min || 15) * 60) < (x.dura_seg || 20));
    k = cand.length ? cand[Math.floor(seg / 60) % cand.length] : null;
  }
  if (k && k !== mostrando) { pintar(k); requestAnimationFrame(() => c.classList.add('on'));
    if (!PRUEBA) try { fetch(VISTAS + '?c=' + encodeURIComponent(k.id || k.marca || '') + '&canal=' + encodeURIComponent(CANAL || 'anonimo'), { mode: 'no-cors' }); } catch (e) {} }
  if (!k && mostrando) { c.classList.remove('on'); setTimeout(() => { if (!mostrando) c.innerHTML = ''; }, 600); }
  mostrando = k;
}
cargar().then(tick); setInterval(cargar, REVISAR_MIN * 60000); setInterval(tick, 1000);
</script>
</body></html>
