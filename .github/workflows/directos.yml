# Cada hora revisa los directos nuevos del canal y actualiza directos.json (lo lee la página). 20 nov 2026.
name: Directos recientes
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths: ["actualizar_directos.py", ".github/workflows/directos.yml"]
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 actualizar_directos.py
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain directos.json)" ]; then
            git config user.name "Lumi (directos)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add directos.json
            git commit -m "Directos recientes al día"
            git push
          fi
