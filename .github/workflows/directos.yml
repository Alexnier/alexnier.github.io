# Cada 10 min: directos nuevos, si ALEXNIER está en vivo y la tienda (directos.json, vivo.json, tienda.json; los lee la página). 20 nov 2026.
name: Datos de la página
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths: ["actualizar_directos.py", ".github/workflows/directos.yml"]
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 actualizar_directos.py
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain directos.json vivo.json tienda.json)" ]; then
            git config user.name "Lumi (directos)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add directos.json vivo.json tienda.json
            git commit -m "Datos de la página al día"
            git push
          fi
